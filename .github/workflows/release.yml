name: Release

# A tag v<version> publishes to PyPI; a manual run only tests and builds the packages.
# Each package has its own environment (pypi-<package>) because
# a trusted publisher configuration can only be registered for one project name.
# Packages whose version is already on the index are skipped, so a connector
# release does not fail when survey-structure or survey-data-dictionary are unchanged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches the connector version
        if: github.event_name == 'push'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi
      - run: uv build --all-packages
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - package: survey-structure
            files: survey_structure-*
          - package: survey-data-dictionary
            files: survey_data_dictionary-*
          - package: limesurvey-connector
            files: limesurvey_connector-*
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Keep only this package's files
        run: find dist -type f ! -name '${{ matrix.files }}' -delete && ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
